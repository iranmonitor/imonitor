[package]
name = "iranmonitor_node"
version = "2.1.0"
edition = "2021"
description = "Free iMonitor monitoring and tunnel dashboard with guided setup and native diagnostics"
license-file = "LICENSE"
build = "build.rs"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = "symbols"
panic = "abort"
debug = 0
incremental = false

[dependencies]
serde = { version = "1.0.203", features = ["derive"] }
serde_json = "1.0.117"
base64 = "0.22.1"
ring = "0.17.8"
argon2 = "0.5.3"
base64ct = "=1.6.0"
socket2 = "0.5.10"
